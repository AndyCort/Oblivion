<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <clipPath id="spaceClip">
      <rect x="6" y="6" width="116" height="116" rx="28" />
    </clipPath>
  </defs>

  <!-- Deep Space Canvas (Flat) -->
  <g clip-path="url(#spaceClip)">
    <rect x="6" y="6" width="116" height="116" rx="28" fill="#0B0716" />

    <!-- Subtle Flat Cosmic Dust Bands -->
    <ellipse
      cx="64"
      cy="64"
      rx="54"
      ry="26"
      transform="rotate(-28 64 64)"
      fill="#1A1033"
    />
    <ellipse
      cx="64"
      cy="64"
      rx="40"
      ry="18"
      transform="rotate(-28 64 64)"
      fill="#261547"
    />

    <!-- Background Constellations (星图连线) -->
    <g stroke="#4E3880" stroke-width="1" stroke-linecap="round">
      <polyline points="20,30 31,22 44,29" />
      <polyline points="84,104 97,98 106,108" />
      <line x1="20" y1="96" x2="32" y2="105" />
    </g>

    <!-- Distant Starfield -->
    <g fill="#C9B8FF">
      <circle cx="20" cy="30" r="1.5" />
      <circle cx="31" cy="22" r="2" fill="#FFD1E3" />
      <circle cx="44" cy="29" r="1.3" />
      <circle cx="84" cy="104" r="1.4" />
      <circle cx="97" cy="98" r="2" fill="#FFD1E3" />
      <circle cx="106" cy="108" r="1.4" />
      <circle cx="20" cy="96" r="1.5" />
      <circle cx="32" cy="105" r="1.8" />
      <circle cx="104" cy="26" r="1.6" fill="#FFE6F0" />
      <circle cx="18" cy="58" r="1.2" />
      <circle cx="110" cy="70" r="1.2" />
      <circle cx="56" cy="17" r="1.1" />
      <circle cx="72" cy="111" r="1.1" />
    </g>

    <!-- Tilted Spiral Galaxy System (倾斜螺旋银河) -->
    <g transform="translate(64 64) rotate(-26) scale(1 0.58) translate(-64 -64)">
      <!-- Outer Violet Dust Arms -->
      <path
        d="M64 64C76 48 96 42 112 52C120 57 124 68 118 82"
        stroke="#6B42D6"
        stroke-width="7"
        stroke-linecap="round"
      />
      <path
        d="M64 64C52 80 32 86 16 76C8 71 4 60 10 46"
        stroke="#6B42D6"
        stroke-width="7"
        stroke-linecap="round"
      />

      <!-- Outer Dashed Star Streams (旋臂星流虚线) -->
      <path
        d="M64 64C82 40 104 38 116 54C124 66 118 86 100 98"
        stroke="#A480FF"
        stroke-width="1.8"
        stroke-dasharray="2 6"
        stroke-linecap="round"
      />
      <path
        d="M64 64C46 88 24 90 12 74C4 62 10 42 28 30"
        stroke="#A480FF"
        stroke-width="1.8"
        stroke-dasharray="2 6"
        stroke-linecap="round"
      />

      <!-- Mid Magenta Spiral Arms -->
      <path
        d="M64 64C72 50 90 48 102 58C110 65 108 78 96 86"
        stroke="#DE58C8"
        stroke-width="5.5"
        stroke-linecap="round"
      />
      <path
        d="M64 64C56 78 38 80 26 70C18 63 20 50 32 42"
        stroke="#DE58C8"
        stroke-width="5.5"
        stroke-linecap="round"
      />

      <!-- Inner Rose-Pink Spiral Arms -->
      <path
        d="M64 64C69 54 81 53 89 60C94 65 92 74 84 79"
        stroke="#FF86B2"
        stroke-width="4"
        stroke-linecap="round"
      />
      <path
        d="M64 64C59 74 47 75 39 68C34 63 36 54 44 49"
        stroke="#FF86B2"
        stroke-width="4"
        stroke-linecap="round"
      />

      <!-- Secondary Fine Arms -->
      <path
        d="M64 64C54 52 54 36 68 28C80 21 96 26 104 36"
        stroke="#8C5EFF"
        stroke-width="2.5"
        stroke-linecap="round"
      />
      <path
        d="M64 64C74 76 74 92 60 100C48 107 32 102 24 92"
        stroke="#8C5EFF"
        stroke-width="2.5"
        stroke-linecap="round"
      />

      <!-- Galaxy Core Rings -->
      <circle cx="64" cy="64" r="13" fill="#FF9EC4" />
      <circle cx="64" cy="64" r="8" fill="#FFE8F1" />
    </g>

    <!-- Crisp Un-skewed Galaxy Core Starlight (银河中心星芒) -->
    <path
      d="M64 49C64 61.5 65.5 63 78 63C65.5 63 64 64.5 64 77C64 64.5 62.5 63 50 63C62.5 63 64 61.5 64 49Z"
      fill="#FFFFFF"
    />
    <circle cx="64" cy="63" r="4" fill="#FFFFFF" />

    <!-- Accent Four-Point Stars -->
    <path
      d="M95 34C95 38.2 95.5 38.7 99.7 38.7C95.5 38.7 95 39.2 95 43.4C95 39.2 94.5 38.7 90.3 38.7C94.5 38.7 95 38.2 95 34Z"
      fill="#FFE2EE"
    />
    <path
      d="M32 82C32 85.4 32.4 85.8 35.8 85.8C32.4 85.8 32 86.2 32 89.6C32 86.2 31.6 85.8 28.2 85.8C31.6 85.8 32 85.4 32 82Z"
      fill="#C4A6FF"
    />
    <path
      d="M84 82C84 84.5 84.3 84.8 86.8 84.8C84.3 84.8 84 85.1 84 87.6C84 85.1 83.7 84.8 81.2 84.8C83.7 84.8 84 84.5 84 82Z"
      fill="#FF9EC4"
    />
  </g>

  <!-- Subtle Flat Border -->
  <rect x="7" y="7" width="114" height="114" rx="27" stroke="#2D1F4A" stroke-width="2" />
</svg>

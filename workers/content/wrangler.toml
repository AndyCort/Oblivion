name = "oblivion-content"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# 启用 Workers 边缘缓存：接口按 cdn-cache-control 缓存 5 分钟，
# 发布接口写入成功后会用 ctx.cache.purge 主动清除 /api/articles 相关缓存。
[cache]
enabled = true

# 首次部署前执行：npm run db:create
# 然后把返回的 database_id 填到下面，再执行 npm run db:init
[[d1_databases]]
binding = "DB"
database_name = "oblivion-content"
database_id = "3dd3ccfd-5ec8-455a-95a5-9badc9aa216f"

# 发布接口密钥：npm run deploy 之前先执行 npx wrangler secret put PUBLISH_SECRET
# 本地开发时在 workers/content/.dev.vars 里写 PUBLISH_SECRET=xxx
